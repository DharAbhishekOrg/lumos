# Lumos - CI / Secret-scan configuration (TRS-REP-005, TRS-CICD-001).
# Author: dhar.abhishek.email@gmail.com
# Implements: TRS-REP-005, TRS-CICD-001
# ADRs: -
# Threading: n/a
#
# The pipeline runs this over the FULL history (`--log-opts=--all --full-history`),
# not just the diff. A credential committed and then removed in a later commit is
# still published: it is in the pack file, in every clone and in every fork. A
# diff-only scan would report such a branch clean, which is the exact failure
# this requirement exists to prevent.
#
# ON ALLOWLISTS. Every entry below widens the blind spot, so each one names the
# compensating control that covers the same ground. An allowlist with no
# compensating control is how a real secret ends up hidden in test data.
#
# The baseline before this file existed was 25 findings, every one of them a
# false positive from the `generic-api-key` rule: 23 in the golden vectors
# (fields named *_key_hex, holding generated test material) and 2 in ADR prose
# where the word "key" precedes a long token. Each is scoped below by rule id,
# never blanket-suppressed, so a genuinely new rule still fires in those files.

title = "Lumos secret scan"

[extend]
useDefault = true

# --- repository-owned rules ---------------------------------------------------

# Private key material in the golden vectors must be testonly_-prefixed in the
# FIELD NAME, not merely in a provenance field elsewhere in the file. This is
# the line-granularity companion to TestVectorFilesCarryRegisterHashAndProvenance
# in tools/vectorgen, which enforces TESTONLY- provenance at file granularity.
# Together they are the compensating control for the generic-api-key allowlist
# over test-vectors/ further down.
#
# Scoped to private material (priv/seed) rather than every *_key_hex field:
# derived values such as shared_secret_hex and message_key_hex are OUTPUTS of a
# KAT, computed from testonly_ inputs, and the file-level provenance assertion
# is the right control for those. Requiring a prefix on a derived value would be
# noise, and noise is how a real finding gets waved through.
[[rules]]
id = "lumos-untagged-private-key-material"
description = "Private key material in test-vectors without a testonly_ field name"
regex = '''"[a-zA-Z0-9_]*(priv|seed)[a-zA-Z0-9_]*"\s*:\s*"[0-9a-fA-F]{32,}"'''
path = '''test-vectors/.*\.json'''
[rules.allowlist]
description = "vectorgen emits private material only under testonly_-prefixed field names"
regexTarget = "match"
regexes = ['''"testonly_[a-zA-Z0-9_]*"''']

# A PEM private key block is never correct in this repository, in any file, at
# any time - not even TESTONLY. The default rule set matches several key body
# formats; this matches the header itself, so a truncated or unusual body cannot
# slip past a body-shaped pattern.
[[rules]]
id = "lumos-pem-private-key"
description = "PEM private key block"
regex = '''-----BEGIN [A-Z ]*PRIVATE KEY( BLOCK)?-----'''
[rules.allowlist]
description = "this configuration file necessarily quotes the pattern it detects"
paths = ['''\.gitleaks\.toml''']

# --- allowlists ---------------------------------------------------------------
# Each is scoped with targetRules so it suppresses one known-noisy rule in one
# place, rather than blinding the whole scanner to a directory.

[[allowlists]]
description = """
Golden vectors. Every *_key_hex, *_secret_hex and *_priv_hex field here holds \
material generated by tools/vectorgen from TESTONLY- seeds. Compensating \
controls: lumos-untagged-private-key-material above, and the vectorgen test \
suite, which fails the build if any emitted file's key_provenance is not \
TESTONLY-namespaced. Nothing enters this directory except through \
tools/vectorgen - the single-generator rule of TRS Sec. 18.4."""
targetRules = ["generic-api-key"]
paths = ['''test-vectors/.*\.json''']

[[allowlists]]
description = """
ADR prose. Two findings where the word "key" precedes a long token in a \
sentence ("separate X25519 identity-DH key, Ed25519-signed..."). Compensating \
control: these files are Markdown, never executed and never deployed, and a \
real credential pasted into an ADR would still be caught by every \
provider-specific rule, which stay active here."""
targetRules = ["generic-api-key"]
paths = ['''docs/adrs/.*\.md''']

[[allowlists]]
description = """
Lockfile integrity digests and pinned distribution checksums. These look \
exactly like high-entropy secrets and are the opposite of one: they are the \
mechanism that makes the supply chain verifiable. Compensating control: \
tools/deplock asserts every npm entry is https-resolved with a sha256-or-better \
integrity hash, and that the Gradle wrapper checksum matches the toolchain \
manifest."""
paths = [
  '''admin-console/package-lock\.json''',
  '''go\.sum''',
  '''gradle/wrapper/gradle-wrapper\.properties''',
  # Binary. Compensating control: gradle/actions/wrapper-validation checks it
  # against Gradle's published checksums, a stronger statement than "contains
  # no secret".
  '''gradle/wrapper/gradle-wrapper\.jar''',
]

[[allowlists]]
description = """
Baselined specification PDFs and the retained handover archive: binary, \
owner-supplied and byte-identical to what was handed over. They are evidence \
and cannot be edited. Compensating control: never executed, never deployed, and \
any change to them shows up as a binary diff in review."""
paths = [
  '''docs/.*\.pdf''',
  '''docs/handover/.*\.zip''',
]
