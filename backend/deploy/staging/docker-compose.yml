# Lumos - backend/deploy/staging / Local and CI staging: lumosd with PostgreSQL and Redis.
# Author: dhar.abhishek.email@gmail.com
# Implements: TRS-BCK-001, TRS-BCK-003, TRS-BCK-008, SRS-DAT-003
# ADRs: ADR-001
# Notes: WP-05 S8. The composed backend the integration suite runs against.
# Only the API is published, and only on 127.0.0.1. PostgreSQL and Redis sit
# on the private compose network: they use no password because nothing
# outside that network can reach them, so no credential is committed
# (TRS-REP-005). This is a throwaway local stack, never a deployment recipe
# for a reachable host; the cloud staging deploy is owner-executed
# (docs/ops/staging-deploy.md). Redis runs with noeviction (eviction would
# silently drop pending envelopes) and an append-only file, so a restart
# keeps queued mail as a managed Redis would. Redis is pinned to the 7.2 line,
# the last under BSD-3-Clause (7.4+ is RSALv2/SSPLv1). Images are pinned by
# digest.
#
#   docker compose -f backend/deploy/staging/docker-compose.yml up -d --build --wait

name: lumos-staging

services:
  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_DB: lumos
      POSTGRES_USER: lumos
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumos -d lumos"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2-alpine@sha256:2f66de68111e64c3927859f158f8e666066dae2b97d9f82770a6f37a5aa1c335
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  lumosd:
    build:
      context: ../../..
      dockerfile: backend/deploy/staging/Dockerfile
      args:
        REVISION: ${LUMOS_REVISION:-unknown}
        BUILT_AT: ${LUMOS_BUILT_AT:-unset}
    image: lumos/lumosd:staging
    environment:
      LUMOS_DATABASE_URL: postgres://lumos@postgres:5432/lumos?sslmode=disable
      LUMOS_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
