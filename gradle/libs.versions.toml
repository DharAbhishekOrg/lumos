# Lumos - build / Version catalogue: pinned plugin and library versions.
# Author: dhar.abhishek.email@gmail.com
# Implements: TRS-REP-003
# ADRs: -
# Threading: n/a
# Notes: TRS-REP-003 requires dependency versions to be locked and updateable
# through controlled automation. A single catalogue is that control point: every
# module resolves its versions from here, so an update is one reviewed change
# rather than a hunt through build files.

[versions]
# AGP 9.3.1: the 8.x line uses a Gradle internal API removed in Gradle 9.6, so
# it cannot run on the pinned Gradle 9.7 wrapper. Gradle's own failure message
# offers "downgrade to Gradle 9.5" as the alternative; moving the plugin forward
# is the better trade, since the wrapper is checksum-pinned and shared with the
# conformance module.
androidGradlePlugin = "9.3.1"
gson = "2.11.0"
junit = "5.11.3"
# TRS-CODE-006 names Checkstyle and SpotBugs. Both are LGPL-2.1 - copyleft
# family - so they are declared loudly here as AGENTS.md Sec. 3 requires. Both
# are build-time analysers: never linked into, bundled with or shipped in any
# artefact, and LGPL-2.1 places no obligation on the sources they read.
#
# Checkstyle stays on the 12.x line, and the REASON has changed even though the
# number has not. 13.10.0 was refused by the JVM ("not compatible with the
# configured JVM (17)"), and CR-002 has since moved the toolchain to Java 21, so
# that obstacle is gone. Raising Checkstyle is now an ordinary dependency
# decision rather than a blocked one - and CR-002 says in as many words that it
# is a SEPARATE decision and not part of that change request. Raising it here
# would be smuggling a second change through the door the first one opened.
#
# Recorded as a deferral in evidence/wp02/closeout.md with WP-03 as its
# destination: the first slice that touches the analyser stack should try 13.x
# on the Java 21 toolchain and take the new rules deliberately.
checkstyle = "12.3.1"
spotbugs = "4.10.3"
spotbugsPlugin = "6.5.10"
# sqlite-jdbc, Apache-2.0, TEST SCOPE ONLY. The persistence layer runs against a
# narrow SqlDatabase seam; on a device that seam is android.database.sqlite,
# which no JVM unit test can load. This driver puts a REAL SQLite engine behind
# the same seam in CI, so the migration DDL and the encryption-at-rest
# assertions execute against the engine that will run them on a device rather
# than against a hand-written fake that would only ever agree with its author.
sqliteJdbc = "3.53.2.1"
# Room, Apache-2.0. Adopted in WP-02 S3 per the owner's ruling of 2026-08-14:
# the SqlDatabase seam stays the cross-platform storage contract, and Room sits
# BEHIND it as the Android production store. TRS-AND-004 is what it satisfies.
room = "2.8.4"
# AndroidX test, Apache-2.0. Instrumented-test scope only, never shipped. They
# exist so the Room half can be executed on an emulator in CI rather than
# asserted about - the condition the same ruling attached to TRS-AND-004.
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
# Lazysodium-android 5.2.0, MOZILLA PUBLIC LICENSE 2.0, bundling libsodium (ISC).
# Adopted in WP-02 S4b on the owner's approval of 2026-08-18, under conditions
# recorded verbatim in tools/toolchain/toolchain-manifest.json: UNMODIFIED USE
# ONLY, the licence text in the app's third-party notices, an SBOM entry, and -
# if patching ever becomes necessary - a switch to a direct libsodium JNI binding
# rather than a fork.
#
# This is the FIRST copyleft dependency the project ships. Checkstyle and
# SpotBugs are LGPL-2.1 but are build-time analysers that never enter an
# artefact; this one is linked into the APK. MPL-2.0 is file-scoped: using it
# unmodified imposes nothing on Lumos sources, and modifying its own files would
# require publishing those files. The "unmodified use only" condition is what
# keeps that clause dormant, and it is a condition on us, not on the library.
#
# What it is FOR: ADR-001 names libsodium, and Argon2id is the one primitive with
# no platform equivalent - the JCA has no Argon2 at any API level. It also closes
# the API 26-27 gap for ChaCha20-Poly1305, which the JCA only provides from 28.
#
# AT 5.2.0 SINCE CR-002 (WP-02 slice S5). It was held at 5.1.0 for two slices
# because 5.2.0 ships class files at bytecode version 65 and javac under a Java
# 17 toolchain refuses them outright: "class file has wrong version 65.0, should
# be 61.0". That was never a dependency problem - it was a specification value,
# and moving it needed the owner's change request rather than a build file
# raising a pin on a library's behalf.
#
# What the move buys, and why it was worth a change request: 5.2.0 16 KB
# page-aligns its native libraries and 5.1.0 does not. An Android 15 device with
# 16 KB pages cannot map 5.1.0's arm64-v8a/libsodium.so AT ALL - not a
# performance question, a load failure - and Google Play requires the alignment.
# It was the one open G-06 blocker in WP-02. The narrow Aligned16KB lint disable
# that documented the gap is gone with this bump; the check is live again and
# passing, which is the evidence that the alignment is real rather than claimed.
#
# The crypto surface is unchanged across the bump: crypto_pwhash and the AEAD
# entry points LibsodiumRecoveryCrypto binds are identical, and the recovery
# vectors are what prove it rather than the release notes.
lazysodium = "5.2.0"
# JNA 5.17.0, Apache-2.0 OR LGPL-2.1 (dual, at the user's option; Apache-2.0 is
# the option taken). Lazysodium's POM asks for 5.12.1 and asks for the JAR - and
# the JAR carries desktop natives, not Android's libjnidispatch.so. The AAR
# variant under the same coordinates is the Android one, which is why it is
# declared explicitly here and the transitive is excluded in the module. The
# version is raised to the current 5.17.0 with it: the Java half and the native
# half must come from the same artefact or JNA refuses to load, and taking both
# from one pinned coordinate is what guarantees that. Lazysodium touches only
# Native.register and NativeLong, unchanged across the whole 5.x line.
jna = "5.17.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugsPlugin" }

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
# Versionless on purpose: both resolve through the junit-bom platform above, so
# the BOM stays the single place the JUnit 5 version is written down. They are
# catalogued rather than written as strings in a build file because Android
# Lint's UseTomlInstead check is an error under warningsAsErrors, and it is
# right to be - a dependency declared in a build file is one the catalogue's
# controlled-update path (TRS-REP-003) cannot see.
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
lazysodium-android = { module = "com.goterl:lazysodium-android", version.ref = "lazysodium" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
