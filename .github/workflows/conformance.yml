# Lumos - CI / Tri-language protocol conformance (TRS Sec. 18.4).
# Author: dhar.abhishek.email@gmail.com
# Implements: TRS-TST-001, TRS-CICD-001, TRS-PROTO-015, SRS-NFR-CMP-004
# ADRs: ADR-004
# Threading: n/a
# Notes: Three runners consume the SAME committed vector files: Go, pure-JVM
# Java and Swift on macOS. The Swift job is path-filtered to protocol/,
# test-vectors/ and the iOS conformance target, because macOS runner minutes are
# billed at a premium and nothing outside those paths can change what Swift
# asserts. All three are PR-blocking.

name: conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detects whether this change can affect the Swift conformance result.
  changes:
    name: path filter
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: does this change touch protocol, vectors or the iOS target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request - running Swift"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base" "$head")"
          echo "changed files:"; echo "$changed"
          if echo "$changed" | grep -Eq '^(protocol/|test-vectors/|ios-app/protocol-conformance/|Package\.swift|\.github/workflows/conformance\.yml)'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi

  go:
    name: go conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: constants gate
        run: go run ./tools/constantsgen -check
      - name: vector gate (determinism + staleness)
        run: go run ./tools/vectorgen -check
      - name: go test
        run: go test -count=1 -json ./... > go-test.json || (cat go-test.json | tail -50; exit 1)
      - name: upload go test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-go
          path: go-test.json
          retention-days: 7

  java:
    name: java conformance (pure JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: protocol-conformance test
        run: ./gradlew :protocol-conformance:test --no-daemon --console=plain
      - name: upload java test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java
          path: android-app/protocol-conformance/build/test-results/test
          retention-days: 7
      - name: upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-conformance-reports
          path: android-app/protocol-conformance/build/reports/tests/test
          retention-days: 7

  swift:
    name: swift conformance (macOS)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift version
        run: swift --version
      - name: LumosProtocolConformance test
        run: |
          mkdir -p swift-test-results
          swift test --package-path . --xunit-output swift-test-results/results.xml 2>&1
      - name: upload swift test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-swift
          path: swift-test-results
          retention-days: 7

  # The TRS Sec. 19.3 traceability gate. It runs AFTER the three runners so it
  # can prove that every 'tested' status rests on a test which executed in THIS
  # pipeline run - the rule's actual wording, and the one part of the matrix a
  # reviewer cannot verify by reading.
  trace:
    name: traceability gate
    runs-on: ubuntu-latest
    needs: [go, java, swift]
    if: always() && needs.go.result == 'success' && needs.java.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: download test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results
      - name: collect executed tests
        shell: bash
        run: |
          set -euo pipefail
          junit="java=protocol-conformance=test-results/test-results-java"
          if [ -d test-results/test-results-swift ]; then
            junit="$junit,swift=LumosProtocolConformance=test-results/test-results-swift"
          else
            echo "swift results absent (job skipped by the path filter); its tests are not counted as executed this run"
          fi
          go run ./tools/tracecheck -collect evidence/ci/executed-tests.json \
            -run-id "${{ github.run_id }}" \
            -go-json test-results/test-results-go/go-test.json \
            -junit "$junit"
      - name: traceability gate
        run: |
          go run ./tools/tracecheck \
            -base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            -head HEAD \
            -executed evidence/ci/executed-tests.json
      - name: upload executed-test set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-tests
          path: evidence/ci/executed-tests.json
          retention-days: 7

  # A single required check that stays green when the Swift job is deliberately
  # skipped by the path filter, so branch protection does not have to encode the
  # filter logic a second time.
  conformance-gate:
    name: conformance gate
    runs-on: ubuntu-latest
    needs: [go, java, swift, trace]
    if: always()
    steps:
      - name: assess
        shell: bash
        run: |
          set -euo pipefail
          echo "go=${{ needs.go.result }} java=${{ needs.java.result }} swift=${{ needs.swift.result }} trace=${{ needs.trace.result }}"
          if [ "${{ needs.go.result }}" != "success" ] || [ "${{ needs.java.result }}" != "success" ]; then
            echo "Go and Java conformance are always required."
            exit 1
          fi
          if [ "${{ needs.trace.result }}" != "success" ]; then
            echo "The traceability gate is always required (TRS Sec. 19.3)."
            exit 1
          fi
          case "${{ needs.swift.result }}" in
            success) echo "all three runners green" ;;
            skipped) echo "Swift skipped by path filter - no protocol, vector or iOS change" ;;
            *) echo "Swift conformance failed"; exit 1 ;;
          esac
