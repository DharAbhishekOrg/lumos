# Lumos - CI / Tri-language protocol conformance (TRS Sec. 18.4).
# Author: dhar.abhishek.email@gmail.com
# Implements: TRS-TST-001, TRS-CICD-001, TRS-PROTO-015, SRS-NFR-CMP-004
# ADRs: ADR-004
# Threading: n/a
# Notes: Three runners consume the SAME committed vector files: Go, pure-JVM
# Java and Swift on macOS. The Swift job is path-filtered to protocol/,
# test-vectors/ and ios-app/, because macOS runner minutes are billed at a
# premium and nothing outside those paths can change what Swift asserts. All
# three are PR-blocking.
#
# THE FILTER IS AT JOB LEVEL AND MUST STAY THERE. This workflow declares no
# `paths:` or `paths-ignore:` under `on:`, and tools/cicheck fails the build if
# one appears. The distinction is not stylistic: a workflow filtered out by
# `on: paths` never reports its checks at all, and a required check that never
# reports blocks every pull request that does not touch those paths, for ever.
# A job skipped by an `if:` condition still posts a check run - conclusion
# "skipped" - which a ruleset accepts. Job-level is the only form of filtering
# that is compatible with requiring the check.
#
# The check names this workflow reports are the contract between it and the
# repository ruleset. They are listed in docs/ci/required-checks.md and
# tools/cicheck fails if the two disagree.
#
# The Swift job also builds and tests the empty iOS application shell, which
# lives in the same SwiftPM package. Spending a second macOS runner on a target
# this job already compiles would be waste; the lint, secret-scan, dependency,
# SBOM and other three shell builds live in pipeline.yml on Linux runners.
#
# A fourth test job (admin console, node:test) runs here too. It is not protocol
# conformance, and it is here anyway: the traceability gate can only download
# artefacts from its own workflow run, so a test executed in another workflow
# cannot support a 'tested' status no matter how green it is.

name: conformance

on:
  push:
    branches: [main]
  pull_request:
  # A work-package close needs the FULL regression regardless of which paths the
  # closing change happens to touch. The Swift path filter is a cost
  # optimisation for ordinary pull requests, and at a checkpoint it is exactly
  # the wrong behaviour: a closeout that reported "swift: skipped" would be
  # reporting the filter, not the state of the code. The `changes` job forces
  # swift=true for any event that is not a pull request, so a dispatch run is a
  # complete one.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  # TRS-CODE-006's Swift analyser, pinned like every other tool in this
  # repository. SwiftLint ships preinstalled on the macOS runner image, and
  # using that copy would mean the gate's rule set changed whenever GitHub
  # rebuilt the image. MIT licensed; declared in
  # tools/toolchain/toolchain-manifest.json.
  SWIFTLINT_VERSION: 0.65.0

jobs:
  # Detects whether this change can affect the Swift conformance result.
  changes:
    name: path filter
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: does this change touch protocol, vectors or the iOS target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request - running the path-filtered jobs"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base" "$head")"
          echo "changed files:"; echo "$changed"
          if echo "$changed" | grep -Eq '^(protocol/|test-vectors/|ios-app/|Package\.swift|Package\.resolved|\.swiftlint\.yml|\.github/workflows/conformance\.yml)'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi
          # The emulator job is minutes of runner time; only an Android, a
          # protocol or a VECTOR change can alter what it asserts. test-vectors/
          # joined this list in S4b: the instrumented recovery tests read the
          # committed vector files out of the test apk's assets, so a vector
          # change alters what the emulator asserts exactly as a source change
          # does - and a filter that missed it would report green for a suite
          # that never ran against the new bytes.
          if echo "$changed" | grep -Eq '^(android-app/|protocol/gen/java/|test-vectors/|gradle/|settings\.gradle\.kts|\.github/workflows/conformance\.yml)'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  go:
    name: go conformance
    runs-on: ubuntu-latest
    # The backend's registry and relay are held to one contract suite across
    # their memory and server stores: PostgreSQL and Redis (TRS-BCK-008).
    # These throwaway servers exist only for this job; PostgreSQL uses trust
    # auth and Redis has no password, so no secret exists to leak. The tests
    # isolate themselves per test (schema / key namespace), and
    # LUMOS_REQUIRE_POSTGRES / LUMOS_REQUIRE_REDIS turn a missing server into a
    # failure, never a silent skip (TRS-AI-008).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: constants gate
        run: go run ./tools/constantsgen -check
      - name: vector gate (determinism + staleness)
        run: go run ./tools/vectorgen -check
      # Written to RUNNER_TEMP, never into the working tree: repolint's drift
      # check inspects the repository root, and a test artefact dropped there
      # would be flagged by the very run that produced it.
      - name: go test
        shell: bash
        env:
          LUMOS_TEST_POSTGRES_DSN: host=localhost port=5432 user=postgres dbname=postgres sslmode=disable
          LUMOS_REQUIRE_POSTGRES: "1"
          LUMOS_TEST_REDIS_ADDR: localhost:6379
          LUMOS_REQUIRE_REDIS: "1"
        run: |
          set -o pipefail
          if ! go test -count=1 -json ./... > "$RUNNER_TEMP/go-test.json"; then
            echo "--- failing tests ---"
            grep -oE '"Output":"[^"]*(FAIL|panic)[^"]*"' "$RUNNER_TEMP/go-test.json" | head -40
            exit 1
          fi
      - name: upload go test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-go
          path: ${{ runner.temp }}/go-test.json
          retention-days: 7

  java:
    # Check name deliberately says nothing about HOW it runs. "(pure JVM)" was
    # accurate and was also the kind of detail that moves - and a required
    # check whose name moves is a required check that stops reporting until
    # somebody edits the ruleset. docs/ci/required-checks.md is the contract.
    name: java conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: protocol-conformance test
        run: ./gradlew :protocol-conformance:test --no-daemon --console=plain
      - name: upload java test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-java
          path: android-app/protocol-conformance/build/test-results/test
          retention-days: 7
      - name: upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: java-conformance-reports
          path: android-app/protocol-conformance/build/reports/tests/test
          retention-days: 7

  # The admin console's unit tests run HERE rather than beside its shell build
  # in pipeline.yml for one structural reason: the traceability gate below can
  # only download artefacts produced by its own workflow run. A test whose
  # results the gate cannot see is a test that cannot support a 'tested' status,
  # however green it is. pipeline.yml still proves the shell builds; this proves
  # what it asserts.
  ts:
    name: admin console tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-console/package-lock.json
      - name: test
        working-directory: admin-console
        run: |
          npm ci
          npm test
      - name: upload admin test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ts
          path: admin-console/test-results
          retention-days: 7

  # TRS-REP-004's variant assertions. They live HERE, next to the admin console
  # tests and for the identical structural reason: the traceability gate can only
  # download artefacts produced by its own workflow run, so a test executed in
  # pipeline.yml cannot support a 'tested' status however green it is.
  #
  # All four variants run, and each uploads under its own artefact name. That is
  # not tidiness - Gradle compiles a separate BuildConfig per flavour, so the
  # four runs are four different programs, and collecting them under one module
  # label would collapse four pieces of evidence into one identifier that could
  # be satisfied by any single variant passing.
  #
  # It does NOT reuse the pure-JVM `java` job above: TRS Sec. 18.4 requires
  # :protocol-conformance to stay runnable on a host with no Android SDK, and
  # provisioning one in that job would quietly retire the guarantee.
  android:
    name: android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.1.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v6
      - name: unit tests for all four environments
        run: |
          ./gradlew -PlumosAndroid=true \
            :app:testDevDebugUnitTest \
            :app:testQaDebugUnitTest \
            :app:testStagingDebugUnitTest \
            :app:testProdDebugUnitTest \
            --no-daemon --console=plain
      - name: upload android variant test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-android
          path: android-app/app/build/test-results
          retention-days: 7
      - name: upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-variant-test-reports
          path: android-app/app/build/reports/tests
          retention-days: 7

  # The Room half of TRS-AND-004, on a real Android runtime.
  #
  # Owner ruling 2026-08-14: Room sits behind the SqlDatabase seam as the
  # Android production store, and TRS-AND-004 may only graduate on EXECUTED
  # evidence - which for Room means an emulator, because Room's generated DAOs
  # and its schema creation cannot run on a JVM. The JVM seam tests remain the
  # fast path and cover everything with a decision in it; this job covers what
  # only a device can.
  #
  # Path-filtered like the Swift job and for the same reason: an emulator boot
  # is minutes of runner time, and nothing outside these paths can change what
  # it asserts. KVM is enabled explicitly - without it the emulator falls back
  # to software rendering and takes long enough to time out.
  android-instrumented:
    name: android instrumented tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.1.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v6

      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 30 with the ATD (automated test device) image: the smallest,
          # fastest image that still runs a real Android runtime. The store's
          # minSdk is 26 and its behaviour here is API-independent, so the
          # image is chosen for boot time rather than for coverage.
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew -PlumosAndroid=true :app:connectedDevDebugAndroidTest --no-daemon --console=plain

      - name: upload instrumented results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-android-instrumented
          path: android-app/app/build/outputs/androidTest-results/connected
          retention-days: 7

  # This job carries BOTH Swift deliverables - the protocol conformance runner
  # and the empty iOS application shell - because they are targets of one
  # SwiftPM package and macOS runner minutes are billed at a premium. A second
  # macOS job to compile a shell that this one already builds would be waste.
  swift:
    name: swift conformance
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: swift version
        run: swift --version

      # TRS-REP-003: the Swift dependency is pinned twice over - `exact:` in
      # Package.swift and an immutable revision in Package.resolved - and this
      # step is what proves the two agree. Package.resolved was authored from
      # the upstream tag's commit rather than produced by `swift package
      # resolve`, because Swift does not exist on the authoring host; this is
      # the run that confirms SwiftPM lands on the same revision. A moved tag
      # would fail here rather than silently changing what the recovery vectors
      # are tested against.
      - name: resolve and verify the pinned Swift dependency
        run: |
          set -euo pipefail
          swift package resolve
          pinned="cfd195c76882aa9b997560ca7cb95d72fbf5db00"
          if ! grep -q "$pinned" Package.resolved; then
            echo "swift-sodium did not resolve to the committed revision $pinned"
            cat Package.resolved
            exit 1
          fi
          echo "swift-sodium pinned at $pinned"

      # TRS-CODE-006, Swift half one: the linter. It rides this job rather than
      # taking a second macOS runner - every Swift source it reads is inside
      # this job's path filter, and .swiftlint.yml was added to that filter with
      # it. --strict turns SwiftLint's warnings into failures, which is the only
      # setting under which "zero-warning" is a gate rather than a report.
      - name: install swiftlint (pinned)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          mkdir -p "$RUNNER_TEMP/swiftlint"
          unzip -q -o "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: swiftlint lint (strict)
        run: |
          swiftlint version
          swiftlint lint --strict --config .swiftlint.yml

      # TRS-CODE-006, Swift half two: "Swift 6 strict concurrency diagnostics".
      # That half is the compiler, not the linter. Package.swift already puts
      # every target in .swiftLanguageMode(.v6); -warnings-as-errors is what
      # stops a diagnostic from being printed and then ignored.
      #
      # This is the step that carries the zero-warning claim for Swift. It
      # compiles EVERY target - LumosProtocolGenerated, LumosProtocol and
      # LumosAppShell - so no Swift source in the repository escapes it.
      - name: build every target with warnings as errors
        run: swift build --package-path . -Xswiftc -warnings-as-errors

      # The iOS shell compiled for iOS, not merely for the macOS host. Building
      # a library on the host proves nothing about the platform it ships to,
      # and that gap is exactly where an iOS-only availability error hides.
      #
      # --scratch-path keeps this build's artefacts away from the host build
      # above; both otherwise default to .build and SwiftPM reuses whichever
      # module cache it finds there.
      #
      # -warnings-as-errors is deliberately NOT passed here, and the reason is a
      # real finding rather than a convenience. SwiftPM has no cross-compilation
      # mode for this: it invokes swiftc with the HOST destination and we
      # override the SDK and triple through -Xswiftc, which leaves the driver
      # emitting "using sysroot for 'MacOSX' but targeting 'iPhone'". That
      # warning has been emitted by this step since WP-01 and is about SwiftPM's
      # own invocation, not about any Lumos source. Promoting it to an error
      # fails the job on toolchain plumbing nobody can fix in this repository.
      #
      # The zero-warning claim for Swift therefore rests on the host build
      # above, which compiles the same sources - including LumosAppShell - with
      # -warnings-as-errors. What that does not cover is an iOS-ONLY diagnostic,
      # such as an availability warning for an API newer than iOS 17. Since
      # WP-05 S7f2b the shell has iOS-only code (RelayBackground, behind
      # #if os(iOS): BackgroundTasks and Network), so this step is now the only
      # compile of it: its ERRORS fail here, its warnings do not. Closing that
      # needs a Swift SDK destination rather than -Xswiftc overrides.
      - name: build the iOS shell for iOS
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          target="arm64-apple-ios17.0"
          swift build --package-path . --target LumosAppShell \
            --scratch-path "$RUNNER_TEMP/ios-build" \
            -Xswiftc -sdk -Xswiftc "$sdk" \
            -Xswiftc -target -Xswiftc "$target"

      # Two filtered runs rather than one, so each test target's results carry
      # its own module label into the traceability matrix. The build is shared,
      # so the second run costs compile time only for the test target itself.
      - name: LumosProtocolConformance test
        run: |
          mkdir -p swift-test-results
          # --parallel is REQUIRED: without it SwiftPM runs XCTest in one process
          # and writes no xUnit report, leaving the traceability gate blind to
          # Swift while still reporting success.
          swift test --package-path . --parallel \
            --filter LumosProtocolConformance \
            --xunit-output swift-test-results/results.xml 2>&1

      - name: LumosAppShell test
        run: |
          mkdir -p swift-shell-results
          swift test --package-path . --parallel \
            --filter LumosAppShellTests \
            --xunit-output swift-shell-results/results.xml 2>&1

      - name: upload swift test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-swift
          path: swift-test-results
          retention-days: 7
      - name: upload iOS shell test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-swift-shell
          path: swift-shell-results
          retention-days: 7

  # The TRS Sec. 19.3 traceability gate. It runs AFTER the three runners so it
  # can prove that every 'tested' status rests on a test which executed in THIS
  # pipeline run - the rule's actual wording, and the one part of the matrix a
  # reviewer cannot verify by reading.
  trace:
    name: traceability gate
    runs-on: ubuntu-latest
    needs: [changes, go, java, android, android-instrumented, swift, ts]
    # always(), and the upstream results are asserted in the job's FIRST STEP
    # rather than here. The difference matters and it is the whole of this
    # slice's hardening: GitHub reports an `if`-skipped job as a check run with
    # conclusion "skipped", and a ruleset counts a skipped required check as
    # satisfied. So a required job whose `if` depends on another job's result
    # is a required check that disappears at exactly the moment something broke.
    # This job used to skip whenever go, java, android or ts failed; it now runs
    # and fails, which is the only reporting that means anything.
    #
    # The rule this encodes, enforced for every required check by
    # tools/cicheck: a required job may be skipped ONLY for "not applicable on
    # this diff" - the path filter - and never for "an upstream job failed".
    if: always()
    steps:
      - name: upstream results
        shell: bash
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }} go=${{ needs.go.result }} java=${{ needs.java.result }} android=${{ needs.android.result }} instrumented=${{ needs.android-instrumented.result }} swift=${{ needs.swift.result }} ts=${{ needs.ts.result }}"
          # The path filter deciding nothing is not a licence to skip the jobs
          # it filters: if `changes` failed, "swift=skipped" means "unknown",
          # not "not applicable".
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::the path filter did not complete, so a skipped Swift or emulator job cannot be read as deliberate."
            exit 1
          fi
          for pair in "go=${{ needs.go.result }}" "java=${{ needs.java.result }}" \
                      "android=${{ needs.android.result }}" "ts=${{ needs.ts.result }}"; do
            if [ "${pair#*=}" != "success" ]; then
              echo "::error::${pair%%=*} did not pass, so there is no executed-test set to judge the matrix against."
              exit 1
            fi
          done
          # These two are path-filtered. Skipped is legitimate; failed is not.
          for pair in "android-instrumented=${{ needs.android-instrumented.result }}" \
                      "swift=${{ needs.swift.result }}"; do
            case "${pair#*=}" in
              success|skipped) ;;
              *) echo "::error::${pair%%=*} failed."; exit 1 ;;
            esac
          done
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: download test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: test-results
      - name: collect executed tests
        shell: bash
        run: |
          set -euo pipefail
          junit="java=protocol-conformance=test-results/test-results-java"
          # One module label per Android flavour. The four runs produce
          # identical class and method names, so a single label would dedupe
          # them into one identifier and a matrix row could be satisfied by any
          # one variant passing - which is precisely the claim TRS-REP-004 is
          # not allowed to make.
          for variant in Dev Qa Staging Prod; do
            lower="$(echo "$variant" | tr '[:upper:]' '[:lower:]')"
            junit="$junit,java=app-$lower=test-results/test-results-android/test${variant}DebugUnitTest"
          done
          # The emulator job is path-filtered, so its results may be absent -
          # which the tightened identifier gate treats as a skipped runner
          # rather than as drift.
          if [ -d test-results/test-results-android-instrumented ]; then
            junit="$junit,java=app-instrumented=test-results/test-results-android-instrumented"
          else
            echo "instrumented results absent (emulator job skipped by the path filter)"
          fi
          if [ -d test-results/test-results-swift ]; then
            junit="$junit,swift=LumosProtocolConformance=test-results/test-results-swift"
          else
            echo "swift results absent (job skipped by the path filter); its tests are not counted as executed this run"
          fi
          if [ -d test-results/test-results-swift-shell ]; then
            junit="$junit,swift=LumosAppShell=test-results/test-results-swift-shell"
          fi
          junit="$junit,ts=admin-console=test-results/test-results-ts"
          go run ./tools/tracecheck -collect evidence/ci/executed-tests.json \
            -run-id "${{ github.run_id }}" \
            -go-json test-results/test-results-go/go-test.json \
            -junit "$junit"
      - name: traceability gate
        run: |
          go run ./tools/tracecheck \
            -base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            -head HEAD \
            -executed evidence/ci/executed-tests.json
      - name: upload executed-test set
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: executed-tests
          path: evidence/ci/executed-tests.json
          retention-days: 7

  # One check that is true when this whole workflow is true, so a ruleset can
  # require a single name instead of restating the path-filter logic. It stays
  # green when Swift or the emulator is deliberately skipped and red for every
  # other reason, including the two that individual required checks miss: a
  # failed path filter, and a job nobody remembered to add to the ruleset.
  #
  # It names EVERY job in the workflow. `ts` was missing from this list until
  # slice S4c's closeout hardening, which meant a failing admin-console suite
  # left this gate green.
  conformance-gate:
    name: conformance gate
    runs-on: ubuntu-latest
    needs: [changes, go, java, android, android-instrumented, swift, ts, trace]
    if: always()
    steps:
      - name: assess
        shell: bash
        run: |
          set -euo pipefail
          results=(
            "path filter=${{ needs.changes.result }}"
            "go conformance=${{ needs.go.result }}"
            "java conformance=${{ needs.java.result }}"
            "android unit tests=${{ needs.android.result }}"
            "admin console tests=${{ needs.ts.result }}"
            "traceability gate=${{ needs.trace.result }}"
          )
          printf '%s\n' "${results[@]}"
          echo "android instrumented tests=${{ needs.android-instrumented.result }} (path-filtered)"
          echo "swift conformance=${{ needs.swift.result }} (path-filtered)"

          failed=0
          for r in "${results[@]}"; do
            if [ "${r#*=}" != "success" ]; then
              echo "::error::${r%%=*} did not pass; it is required on every pull request and is not path-filtered."
              failed=1
            fi
          done

          # The two path-filtered jobs. `skipped` is a real answer here and
          # only here: it means the diff cannot change what they assert.
          case "${{ needs.android-instrumented.result }}" in
            success) echo "emulator green" ;;
            skipped) echo "emulator skipped by the path filter - no Android, protocol or vector change" ;;
            *) echo "::error::the instrumented tests failed."; failed=1 ;;
          esac
          case "${{ needs.swift.result }}" in
            success) echo "swift green" ;;
            skipped) echo "swift skipped by the path filter - no protocol, vector or iOS change" ;;
            *) echo "::error::swift conformance failed."; failed=1 ;;
          esac

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "every conformance stage green or deliberately skipped"
